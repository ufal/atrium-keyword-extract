# .github/workflows/vocab-drift.yml
#
# Vocabulary artifact/config parity gate (issue #6).
#
# WHY THIS EXISTS. vocab_build.py --from-flat --skos --check already proves the nested
# vocabulary is reproducible from the committed flat files (vocab-refresh.yml runs
# it) -- but that workflow only fires monthly or on manual dispatch, and the push/PR
# lane (pre-commit.yml) is lint-only. Nothing in the fast path ever re-ran the build,
# so commit a5e3c8a landed a taxonomy_config.json/taxonomy_overrides.json edit
# without the data_samples/vocab/*.json artifacts that make it take effect at
# runtime: on master the config declared Documentation dissolved while the shipped
# union_nested.json still had all 107 of its excluded terms reachable by the prompt.
# The decision existed in code and was not in force. This workflow is the fix:
# it is a named, path-scoped check so the same drift fails loudly on the next PR
# that touches either half without the other.
#
# Standalone rather than a hub reusable: this is keyword-extract's own build pipeline, nothing
# to share yet. The vocabulary code came here from nlp-enrich and llm-enrich (atrium-keyword-extract#1)
# and exists once now; the build is to be published as a versioned CC0 release asset.
#
# requests is a module-level import in vocab_sources.py (used even offline, for
# type hints/session plumbing) so it is installed here too; lxml is only imported
# lazily for the live-harvest path and --from-flat never reaches it, but it is
# cheap and already in requirements.txt, so installed for parity with
# vocab-refresh.yml rather than relying on that being true forever.

name: Vocabulary Drift

on:
  pull_request:
    paths:
      - "vocab_sources.py"
      - "vocab_manager.py"
      - "vocab_build.py"
      - "data_samples/taxonomy_config.json"
      - "data_samples/taxonomy_overrides.json"
      - "data_samples/vocab/**"
      - "vocab_review.py"
      - "atrium_vocab.py"
      - "corpus_review.py"
      - "tests/test_vocab_build.py"
      - "tests/test_vocab_manager.py"
      - "tests/test_vocab_sources.py"
      - "tests/test_vocab_review.py"
      - "tests/test_corpus_review.py"
      - "tests/test_prompt_template.py"
      - "prompt_template.py"
      - "llm_run.py"
      - "llm_config.txt"
      - "prompts/**"
      - ".github/workflows/vocab-drift.yml"
  push:
    branches: [test, master]
    paths:
      - "vocab_sources.py"
      - "vocab_manager.py"
      - "vocab_build.py"
      - "data_samples/taxonomy_config.json"
      - "data_samples/taxonomy_overrides.json"
      - "data_samples/vocab/**"
      - "vocab_review.py"
      - "atrium_vocab.py"
      - "corpus_review.py"
      - "tests/test_vocab_build.py"
      - "tests/test_vocab_manager.py"
      - "tests/test_vocab_sources.py"
      - "tests/test_vocab_review.py"
      - "tests/test_corpus_review.py"
      - "tests/test_prompt_template.py"
      - "prompt_template.py"
      - "llm_run.py"
      - "llm_config.txt"
      - "prompts/**"
      - ".github/workflows/vocab-drift.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: this job only ever reads the tree

jobs:
  vocab-drift:
    name: Committed vocabulary matches the config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install requests + lxml + pytest
        run: pip install requests lxml pytest

      - name: Controlled-label registry self-test (atrium-project#51)
        # Cheap and hermetic, and it runs BEFORE the build: the registry declares which
        # label values are legal in `lines[].categ`, `pages[].category` and friends, so
        # a registry whose own tables contradict each other would have every later step
        # validating against nonsense. para-drift proves the vendored bytes match the
        # hub's; this proves the bytes are not matching garbage.
        run: python3 atrium_vocab.py --selftest

      - name: Nesting is reproducible from the committed flat files
        # The command vocab-refresh.yml already runs monthly -- here on every PR
        # that touches the taxonomy or the artifacts, so a config edit without a
        # matching rebuild fails immediately instead of silently shipping half-done.
        run: python3 vocab_build.py --from-flat --skos --check

      - name: A real drift IS caught (negative test)
        # The gate must fail when the artifact and the config actually disagree.
        # If this step ever passes silently, the gate above has stopped gating.
        run: |
          cp data_samples/vocab/union_nested.meta.json "$RUNNER_TEMP/meta.bak.json"
          echo '// tampered for the negative test' >> data_samples/vocab/union_nested.meta.json
          rc=0
          python3 vocab_build.py --from-flat --skos --check || rc=$?
          cp "$RUNNER_TEMP/meta.bak.json" data_samples/vocab/union_nested.meta.json
          if [ "$rc" -eq 0 ]; then
            echo "::error::--check accepted a tampered artifact — the drift gate is not gating"
            exit 1
          fi
          echo "[expected] --check rejected the tampered artifact with exit $rc"

      - name: Committed prompt sheets match the configured prompt
        # prompts/prompt_*.txt are what @david-spacil and @motyc read when ruling on
        # wording -- generated files, and therefore the same drift risk the step above
        # exists for. They move whenever the vocabulary, a PROMPT_* flag or the
        # template changes, and none of those edits touches the sheets themselves.
        run: python3 prompt_template.py --check

      - name: A stale sheet IS caught (negative test)
        run: |
          cp prompts/prompt_blocks.txt "$RUNNER_TEMP/blocks.bak.txt"
          echo 'tampered for the negative test' >> prompts/prompt_blocks.txt
          rc=0
          python3 prompt_template.py --check || rc=$?
          cp "$RUNNER_TEMP/blocks.bak.txt" prompts/prompt_blocks.txt
          if [ "$rc" -eq 0 ]; then
            echo "::error::--check accepted a stale sheet — the sheet gate is not gating"
            exit 1
          fi
          echo "[expected] --check rejected the stale sheet with exit $rc"

      # test_vocab_review.py carries the ONLY drift gate on the eight reviewer sheets
      # -- the CSVs @david-spacil and @motyc actually rule from. It used to run just
      # weekly in scheduled-smoke.yml, so a taxonomy edit that left facet_census.csv or
      # context_budget.csv stale shipped green for up to seven days, and the next
      # reviewer opened a sheet describing a config that no longer existed.
      - name: Vocabulary unit and end-to-end tests
        run: python3 -m pytest tests/test_vocab_build.py tests/test_vocab_manager.py
          tests/test_vocab_sources.py tests/test_vocab_review.py
          tests/test_corpus_review.py tests/test_prompt_template.py -v --tb=short
