name: Paradata Canonical Drift
on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@2f6c82f40f83cbb336efbbaa3634c8859db4c847  # v1
    with:
      hub-ref: 2f6c82f40f83cbb336efbbaa3634c8859db4c847
      # atrium-project#72 B: api_util/teitok_read.py and bbox_scale.py are nlp-enrich's, pinned by
      # tests/test_vendored_teitok_parity.py. atrium-project#83: decision_client.py is
      # page-classification's (tests/test_vendored_decision_parity.py), for dm_run.py's line mode. The
      # reusable checks each owner out at the commit its pin file adopted (ADOPTED["commit"]) and
      # compares the copies with it byte for byte, so a push to the owner never turns this
      # repository red; how far the owner has moved on since (its `test` head) is a summary, not a
      # failure (atrium-project#82 B).
      vendored-from: atrium-nlp-enrich atrium-page-classification
