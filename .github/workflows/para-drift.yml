name: Paradata Canonical Drift
on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@439488bb285d48eec099195528f9d1772f3b1119  # v1
    with:
      hub-ref: 439488bb285d48eec099195528f9d1772f3b1119
      # atrium-project#72 B: api_util/teitok_read.py and bbox_scale.py are nlp-enrich's, pinned by
      # tests/test_vendored_teitok_parity.py; the reusable compares them with nlp-enrich's `test`
      # head, so a copy that falls behind turns red here.
      vendored-from: atrium-nlp-enrich
