name: Docker Build & Publish

on:
  push:
    branches: [test, master]
    tags: ['v*']
  pull_request:
    branches: [test, master]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a tag build - that is a publish in flight
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    permissions:
      # security-events:write is required because docker-tool.reusable.yml's
      # build-and-push job uploads the post-publish Trivy SARIF. A reusable
      # workflow's permissions are CAPPED BY THIS BLOCK, so omitting it makes
      # GitHub reject the whole file at parse time with "requesting
      # 'security-events: write', but is only allowed 'security-events: none'"
      # — a startup_failure, not a step failure (#18). Same grant security.yml
      # already makes for its own SARIF upload. Not an escalation: this job
      # already holds packages: write.
      contents: read
      packages: write
      security-events: write
    uses: ufal/atrium-project/.github/workflows/docker-tool.reusable.yml@v1
    secrets:
      # Explicit instead of `secrets: inherit` — the reusable declares and
      # needs only this one (#18). inherit handed it every repo secret.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      image-name: ufal/atrium-keyword-extract
      apt-packages: ""
      pre-install-torch: ""
      requirements: "requirements.txt requirements-test.txt"
      hf-model-cache: false
      # base  -> ghcr.io/ufal/atrium-keyword-extract       (batch CLI, keywords.py)
      # api   -> ghcr.io/ufal/atrium-keyword-extract-api   (python -m service.api, $PORT)
      # llm   -> ghcr.io/ufal/atrium-keyword-extract-llm   (research: the LLM batch, GPU)
      # Targets are passed through verbatim since the template fix — "base"
      # now genuinely builds the `AS base` stage, not the last one.
      build-targets: '["base", "api", "llm"]'
      # issue #55: only `api` is a runnable HTTP server, so only `api` gets the
      # container smoke (docker run -> wait for HEALTHCHECK healthy -> GET /health
      # and /ready -> docker stop and assert a clean exit inside the grace period).
      # `base` and `llm` are batch CLIs — probing either would fail an image that is
      # behaving exactly as intended.
      probe-targets: '["api"]'
      # atrium-project#72: `api` is this stage's production image, the one AMČR pins; its
      # first-party files are declared in .github/production-image.json and checked by
      # workflow-lint. `base` (keywords.py) and `llm` are batch targets: published, never
      # pinned; `llm` is replaced by the controlled kind of the service (atrium-keyword-extract#1).
