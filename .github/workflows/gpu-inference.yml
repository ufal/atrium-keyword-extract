# .github/workflows/gpu-inference.yml
# GPU inference integration tests — runs on a self-hosted GPU runner.
#
# INFRA-GATED: This job stays queued/inert until ARUP provides a self-hosted
# runner registered with the [self-hosted, gpu] labels (@rharasim, owner).
# It never blocks PRs (manual-dispatch + weekly only).
#
# When active it exercises the optional LLM inference path (llm_run.py,
# llm_utils.py) which requires requirements_llm.txt (torch, transformers,
# bitsandbytes, etc.).  The GPU runner must have CUDA drivers installed.
#
# HF_TOKEN: add as a repo/org secret if gated HF models (gemma, llama4) are
# exercised in the slow GPU test suite.

name: GPU Inference Tests

# One GPU run at a time per ref. `cancel-in-progress: false` because these jobs hold a
# shared-cluster allocation: killing one mid-run wastes the allocation and reports
# nothing, so a second dispatch queues behind the first instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  # INFRA-GATED — needs a self-hosted runner labelled [self-hosted, gpu].
  # No such runner is registered yet (owner: @rharasim), so scheduled runs only
  # queued forever and never reported. The cron is deliberately removed until the
  # runner exists: a weekly job that can never start advertises GPU coverage this
  # repo does not have (#18, 2026-07-29 audit). Every `slow`-marked test lives
  # here — docker-tool.reusable.yml runs `pytest -m "not slow"` — so this is a
  # real gap, not a cosmetic one.
  #
  # RESTORE when the runner is live:
  #   schedule:
  #     - cron: '0 3 * * 1'   # weekly Monday 03:00 UTC (off-peak for shared cluster)
  workflow_dispatch:

env:
  APT_PACKAGES: ""
  PRE_INSTALL_TORCH: ""
  REQUIREMENTS: "requirements.txt requirements-test.txt requirements_llm.txt"

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  gpu-inference:
    name: GPU slow tests
    runs-on: [self-hosted, gpu]
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install base + test + LLM dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt -r requirements_llm.txt

      - name: Run GPU/slow-marked tests (exit-5 tolerant)
        # Exit code 5 = "no tests collected" — tolerated until GPU slow tests
        # exist. `|| rc=$?` is required under the runner's `bash -e` shell.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rc=0
          python -m pytest -m slow -v --tb=short || rc=$?
          # ci-optional: dispatch-only lane; no slow tests exist yet and no GPU runner (#40)
          if [ "$rc" -eq 5 ]; then
            echo "[gpu] No slow tests collected — OK (infra ready)"
            echo "**Optional:** no \`slow\` tests collected (exit 5); this lane proves nothing until they exist." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $rc