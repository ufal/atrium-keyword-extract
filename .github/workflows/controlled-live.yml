# .github/workflows/controlled-live.yml
# The controlled kind against a real LLM backend (atrium-keyword-extract#1, #2).
#
# Every other test of the controlled kind stubs the model (tests/conftest.py: `controlled`), so a
# provider that stops taking the request, or a model whose replies stop validating against the
# vocabulary's schema, stays green everywhere else. This lane runs tests/test_controlled_live.py
# against OpenRouter with the repository's OPENROUTER_KEY secret: one record, two lines, two
# calls of some 50k prompt tokens each.
#
# When: on demand (before a release), weekly (the default branch), and on a push to test that
# changes what the model is sent or how its reply is read. Not on every push and not on pull
# requests: every run is paid for, and a fork's pull request gets no secret anyway.
#
# The model is the manual run's input, else the repository variable OPENROUTER_MODEL, else
# openai/gpt-4o-mini (the service README's example and the hub E2E's default). A failure here is
# first the provider's or the model's answer: read the log before touching the code.

name: Controlled Kind (live LLM)

on:
  push:
    branches: [test]
    paths:
      - "service/api.py"
      - "llm_client_shared.py"
      - "openrouter_client.py"
      - "prompt_template.py"
      - "prompts/system_prompt.txt"
      - "llm_config.txt"
      - "vocab_manager.py"
      - "tool_limits.py"
      - "data_samples/vocab/**"
      - "requirements-test.txt"
      - "tests/test_controlled_live.py"
      - ".github/workflows/controlled-live.yml"
  schedule:
    # Mondays 05:00 UTC, after scheduled-smoke.yml (04:00)
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model id (empty: the OPENROUTER_MODEL variable, else openai/gpt-4o-mini)"
        type: string
        required: false
        default: ""

# A superseded push's run is a paid run nobody reads. The event is in the group, so a push never
# cancels the weekly run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: reads the tree, calls OpenRouter

jobs:
  live:
    name: /extract_keywords kind=controlled against OpenRouter
    # A fork has neither the secret nor anything to prove here.
    if: github.repository == 'ufal/atrium-keyword-extract'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # The light lane's set is enough: the controlled kind needs no KeyBERT, YAKE or torch.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run the controlled kind against OpenRouter
        # The service reads OPENROUTER_API_KEY; the secret keeps the name the hub E2E declares.
        env:
          ATRIUM_LIVE_BACKEND: "1"
          LLM_BACKEND: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model || vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
          OPENROUTER_APP_NAME: atrium-keyword-extract-ci
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::the OPENROUTER_KEY secret is not set in this repository"
            exit 1
          fi
          echo "model: $OPENROUTER_MODEL"
          pytest -s -rs tests/test_controlled_live.py
