# .github/workflows/scheduled-smoke.yml
# Nightly run of the FULL test suite, in a from-scratch environment.
#
# What this replaced, and why (issue atrium-project#10): the step used to run
# `pytest -m slow` against a repo with 0 tests marked @pytest.mark.slow. pytest exits 5
# ("no tests collected") in that case, and the step explicitly tolerated exit 5 -- so
# the nightly ran zero tests and reported success, every night, for as long as it existed.
# A green tick that asserts nothing is worse than no job at all, because it looks like
# coverage.
#
# The fix is not to invent slow markers. The tests this lane can run that the PR lane
# cannot are the ones that SKIP on absent optional dependencies -- the same "untested
# module wearing a green tick" the coverage pass found in llm-enrich (now part of this repo). So this job
# installs the optional stack and runs the whole suite. Exit 5 is no longer tolerated:
# collecting nothing is now a failure, which is what stops this regressing quietly.
#
# `-rs` reports every remaining skip WITH ITS REASON in the log, so a dependency that
# silently stops installing shows up as a growing skip list rather than as nothing.
#
# PARAM block (mirrors docker.yml build args for consistency):
#   APT_PACKAGES     — no extra apt deps for the base keyword-extract image
#   PRE_INSTALL_TORCH — torch is not pre-installed for the CPU-only smoke run
#   REQUIREMENTS     — base + test requirements (no LLM stack)
#
# Infra note: this job runs on GitHub-hosted ubuntu-latest (CPU-only).
# GPU inference tests live in gpu-inference.yml on self-hosted runners.

name: Scheduled Smoke Tests

# Mirrors the hub's e2e-pipeline-smoke.yml: a smoke run that is already executing is
# the one carrying the signal, so a later trigger queues rather than killing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write          # required by "Open Issue on Failure"; GitHub's 403 asked
                         # for exactly this (x-accepted-github-permissions: issues=write).
                         # A permissions block WITHOUT it pins issues=none -> 403.

on:
  schedule:
    # Weekly Monday 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  APT_PACKAGES: ""
  PRE_INSTALL_TORCH: ""
  REQUIREMENTS: "requirements.txt requirements-test.txt"

jobs:
  smoke:
    name: Smoke (slow tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-smoke-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            pip-smoke-${{ runner.os }}-

      - name: Install dependencies
        # transformers unlocks tests/test_lazy_imports.py's transformers case. It is NOT
        # in requirements-test.txt because it pulls tokenizers/safetensors, which is too
        # much to add to every PR run; torch stays out entirely, because gpu-inference.yml
        # already covers the torch-gated tests on a runner that has a GPU.
        run: |
          pip install -r requirements.txt -r requirements-test.txt
          pip install transformers

      - name: Run the full suite
        # No exit-5 tolerance: a run that collects no tests is a failure, not a pass.
        run: python -m pytest tests/ -v --tb=short -rs

      - name: Open Issue on Failure
        # Ported from atrium-translator / ocr-postprocess (#18, 2026-07-29 audit):
        # this repo's smoke test previously failed into the void — nobody was
        # notified, so a red scheduled run looked identical to a green one.
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Scheduled Smoke Test Failed',
              body: 'The automated smoke test failed. Please review the action logs: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['bug', 'automated issue']
            })
