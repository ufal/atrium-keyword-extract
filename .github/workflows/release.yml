# .github/workflows/release.yml
# Creates a GitHub Release with auto-generated notes when a v* tag is pushed.
#
# The Docker image published to GHCR via docker.yaml is the canonical release artefact for
# keyword-extract.  service/ is not a standalone download, so no
# service_bundle.zip is produced here. Since atrium-project#32 round 2 each release carries
# the service's OpenAPI document instead: `openapi.json` (service/openapi.json, stamped with
# the release version) and `openapi.json.sha256` — the spec the AMČR pipeline generates its
# clients from, and the digest a running image reports as /info `openapi_sha256`. The
# release job first checks that the committed spec is what this tag's code generates, then
# compares it with the previous release: a breaking change fails the release unless the
# major version went up (for a 0.x version, 1.0).
#
# `workflow_dispatch` is the dry run (atrium-project#40: an immutable release uses up its
# tag, so the gate is proven BEFORE tagging): every check runs against the dispatched ref
# and the latest release, and nothing is published.
#
# Suggested tagging workflow:
#   git tag -a v1.0.0 -m "v1.0.0 — the first release of keyword-extract"
#   git push origin v1.0.0
#
# After the tag push three workflows fire in sequence:
#   1. docker.yaml        — builds and pushes ghcr.io/ufal/atrium-keyword-extract:v1.0.0
#   2. release.yml        — creates the GitHub Release (this file)
#   3. security.yml       — (scheduled/dispatch) Trivy-scans :latest after :v1.0.0 is live

name: Release

# Never cancel a release. The trigger is a tag push, so each run has its own ref and
# overlap is only possible on a re-run of the same tag — where cancelling the first
# could leave a half-published release behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  # The dry run (see the header): no release is created.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Release gate ────────────────────────────────────────────────────────────
  # A mistagged push (tag != CITATION.cff != para_config.txt [tool] version)
  # fails HERE and blocks the release job below, so nothing gets published.
  # Same check as ufal/atrium-project security.reusable.yml's version-check —
  # both now run the SAME vendored check_version.py, so the two cannot drift
  # apart the way the old inline copies did. It stays a VENDORED FILE rather
  # than a `uses:` on purpose: the guard must not depend on a cross-repo
  # `uses: …@test` resolving at tag-push time (that ordering gap is
  # what let this repo's v1.16.2 tag publish against a 0.16.2 source). Would
  # have blocked it.
  version-guard:
    name: Verify tag == CITATION.cff == para_config.txt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Block release on version/tag mismatch
        # Was a ~45-line inline python heredoc, duplicated verbatim across all
        # five release.yml files and again (in a drifted variant) in the hub's
        # security.reusable.yml. Now one vendored script, held byte-identical to
        # docs/templates/shared/check_version.py by para-drift.reusable.yml (#18).
        # Kept as a vendored file, not a reusable workflow: this gate must not
        # depend on a cross-repo `uses:` resolving at tag-push time.
        env:
          TAG_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # A dry run (workflow_dispatch on a branch) has no tag to compare; it still checks
          # that CITATION.cff and para_config.txt agree.
          if [ "$REF_TYPE" = "tag" ]; then
            python check_version.py \
              --citation CITATION.cff \
              --para-config para_config.txt \
              --tag "$TAG_REF" \
              --require-tag
          else
            python check_version.py --citation CITATION.cff --para-config para_config.txt
          fi

  release:
    name: Create GitHub Release
    needs: version-guard
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── The OpenAPI document (atrium-project#32 item 3) ─────────────────────────
      # Everything below runs the VENDORED atrium_openapi.py (stdlib only, held byte-identical
      # to the hub by para-drift): like check_version.py above, a release gate must not depend
      # on a cross-repo `uses:` resolving at tag-push time (hub docs/docker_gha_roadmap.md §3.3).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check the committed spec is what this commit generates
        # The asset below IS service/openapi.json, so it must be current. This workflow cannot
        # see this commit's api-contract or Docker smoke runs, so it checks for itself, with the
        # pinned light test lane (fastapi and pydantic exactly as the image has them). An
        # import error fails here: a release gate does not skip.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python atrium_openapi.py check --app service.api:app --spec service/openapi.json

      - name: Install oasdiff
        # Pinned to the version atrium_openapi.py's rules were measured against. `go install`
        # verifies the module against sum.golang.org; GOTOOLCHAIN=auto fetches the Go version
        # oasdiff's go.mod asks for.
        env:
          OASDIFF_VERSION: v1.32.1
        run: |
          GOTOOLCHAIN=auto go install "github.com/oasdiff/oasdiff@${OASDIFF_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Stamp the spec and compare it with the previous release
        # stamp: dist/openapi.json (info.version = the release version) + dist/openapi.json.sha256.
        # baseline: the highest release below this tag that carries openapi.json (none → the
        # bootstrap, which passes; an API error fails). compare: a removed reason code always
        # fails; any other breaking change fails unless the major version went up.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python atrium_openapi.py stamp --spec service/openapi.json --para-config para_config.txt --out-dir dist
          printf '%s' "$GH_TOKEN" | python atrium_openapi.py baseline --repo "$GITHUB_REPOSITORY" \
            ${TAG_REF:+--tag "$TAG_REF"} --out "$RUNNER_TEMP/previous.openapi.json" --token-stdin
          python atrium_openapi.py compare --base "$RUNNER_TEMP/previous.openapi.json" --rev dist/openapi.json \
            --para-config para_config.txt --require-oasdiff --summary "$GITHUB_STEP_SUMMARY"

      # ── The vocabulary as a release asset (atrium-keyword-extract#1, atrium-project#72) ──
      # The AMČR keyword lists and the TEATER thesaurus are CC0, and the translator and the hub's
      # E2E read the built vocabulary instead of rebuilding it (a harvest needs two upstream
      # services). The asset is the committed data_samples/vocab files, packed the same way for
      # every release: a zip with a fixed timestamp and file order, so the same files give the
      # same checksum, and `<zip>.sha256` beside it.
      #
      # Two gates first. `vocab_build.py --check` proves the committed nesting is what the
      # taxonomy config produces (the vocab-drift lane's check, repeated here because a release
      # gate does not rely on another workflow's run). It blanks `tool_version`, so the sidecars'
      # stamp is compared here against para_config.txt: data labelled with another release's
      # version is the one provenance error the asset would otherwise carry. The fix is
      # `python vocab_build.py --from-flat --skos`, then commit. A dry run (workflow_dispatch on
      # a branch) runs the same gates, which is how to find out before tagging.
      - name: Package the vocabulary (CC0)
        env:
          TAG_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python vocab_build.py --from-flat --skos --check
          python - <<'PY'
          import configparser
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          vocab = Path("data_samples/vocab")
          config = configparser.ConfigParser()
          config.read("para_config.txt", encoding="utf-8")
          version = config.get("tool", "version")
          tag = os.environ.get("TAG_REF", "")
          assert not tag or tag == version, f"tag {tag} is not para_config.txt's version {version}"

          sidecars = [f"{name}_nested.meta.json" for name in ("union", "amcr", "teater")]
          metas = {name: json.loads((vocab / name).read_text(encoding="utf-8")) for name in sidecars}
          stale = {name: meta.get("tool_version") for name, meta in metas.items() if meta.get("tool_version") != version}
          assert not stale, (
              f"the vocabulary sidecars are stamped {stale}, not {version}: run "
              "`python vocab_build.py --from-flat --skos` and commit the result before tagging"
          )
          licences = {src["name"]: src.get("license") for meta in metas.values() for src in meta.get("sources", [])}
          assert licences and set(licences.values()) == {"CC0"}, f"a source is not CC0: {licences}"

          files = sorted(
              [f"{name}_nested.json" for name in ("union", "amcr", "teater")]
              + sidecars
              + [f"{name}_flat.{ext}" for name in ("amcr", "teater") for ext in ("json", "csv")]
              + ["union.skos.ttl", "vocabulary.csv"]
          )
          total = metas["union_nested.meta.json"]["counts"]["total"]
          sha = os.environ.get("GITHUB_SHA", "unknown")[:12]
          readme = "\n".join(
              [
                  f"ATRIUM vocabulary {version} ({total} terms)",
                  "",
                  "The AMCR keyword lists (the `heslo` set of https://api.aiscr.cz/2.2/oai) and the TEATER thesaurus",
                  "(https://teater.aiscr.cz/), arranged into facets for atrium-keyword-extract. Both sources are CC0,",
                  "as stated by their rights holder (AMCR, atrium-project#6); so is this archive.",
                  "",
                  f"Built by atrium-keyword-extract {version} ({sha}) with `python vocab_build.py --from-flat --skos`,",
                  "from the flat harvests in this archive.",
                  "",
                  "  union_nested.json        the vocabulary the pipeline reads (VOCAB_PATH): both sources nested into facets",
                  "  union_nested.meta.json   its provenance: source endpoints, record counts, tool version, taxonomy hashes",
                  "  amcr_nested.json, teater_nested.json (+ .meta.json)  the same nesting for one source alone",
                  "  amcr_flat.*, teater_flat.*  the harvests, every field the source gave",
                  "  union.skos.ttl           the SKOS view, under the sources' own URIs",
                  "  vocabulary.csv           the union as a Czech-English glossary (source_lemma, target_translation)",
                  "",
                  "Verify the archive with the .sha256 file published beside it.",
                  "",
              ]
          )
          out = Path("dist")
          out.mkdir(exist_ok=True)
          name = f"atrium-vocabulary-{version}.zip"
          with zipfile.ZipFile(out / name, "w", zipfile.ZIP_DEFLATED) as archive:
              for arcname, data in [("README.txt", readme.encode("utf-8"))] + [(f, (vocab / f).read_bytes()) for f in files]:
                  info = zipfile.ZipInfo(arcname, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, data)
          digest = hashlib.sha256((out / name).read_bytes()).hexdigest()
          (out / f"{name}.sha256").write_text(f"{digest}  {name}\n", encoding="utf-8")
          print(f"{name}: {len(files)} files, {total} terms, sha256 {digest}")
          PY

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        # SHA-pinned: this action holds `contents: write`. A moving tag can be
        # force-pushed to malicious code -- exactly what happened to
        # aquasecurity/trivy-action in 2026-03 (GHSA-69fq-xp46-6x23). Dependabot
        # keeps the SHA and the trailing version comment in step (#18).
        #
        # The spec and the vocabulary are attached in this same step, when the release is created:
        # an immutable release (atrium-project#40) refuses assets added after it is published.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            dist/openapi.json
            dist/openapi.json.sha256
            dist/atrium-vocabulary-*.zip
            dist/atrium-vocabulary-*.zip.sha256
