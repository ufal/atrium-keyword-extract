# .github/workflows/vocab-refresh.yml
# Harvest the AMCR and TEATER controlled vocabularies on a hosted runner.
#
# WHY THIS EXISTS. Stage 1 of the vocabulary build (vocab_sources.py) is the only part
# that needs the internet, and the machines the pipeline usually runs on cannot reach
# api.aiscr.cz. A GitHub-hosted runner can, so this job is how the flat artifacts get
# produced without anyone needing a networked workstation. Stage 2 (the nesting) is pure
# and runs anywhere -- see `python3 vocab_build.py --from-flat`.
#
# The `--from-flat --check` step is not redundant with the harvest above it: it proves
# the nesting is reproducible from the committed flat files alone, which is the property
# that lets the taxonomy be re-tuned offline and reviewed as a diff.
#
# PARAM block mirrors scheduled-smoke.yml.

name: Vocabulary Refresh

# Ref-less group: this workflow reaches out to api.aiscr.cz and writes artifacts, so exactly
# one harvest runs at a time across the whole repository, not one per branch.
# `cancel-in-progress: false` — a killed harvest leaves a partial OAI-PMH walk, and being
# polite to a public endpoint matters more than a fast queue.
concurrency:
  group: vocab-refresh
  cancel-in-progress: false

permissions:
  contents: write        # create-pull-request writes the branch
  pull-requests: write   # ...and opens the PR
  issues: write          # required by "Open Issue on Failure" (a partial block pins
                         # the omitted scopes to none and yields a 403)

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Which vocabularies to harvest'
        type: choice
        options: [both, amcr, teater]
        default: both
      teater_mode:
        description: 'TEATER source: pinned GitHub snapshot, or the live export'
        type: choice
        options: [snapshot, live]
        default: snapshot
      open_pr:
        description: 'Open a PR with the refreshed artifacts'
        type: boolean
        default: false
  schedule:
    # Monthly, 1st at 05:00 UTC. Vocabularies move slowly; a nightly run would be noise.
    - cron: '0 5 1 * *'

jobs:
  harvest:
    name: Harvest AMCR + TEATER
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-vocab-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-vocab-${{ runner.os }}-

      - name: Install dependencies
        # requests and lxml are both already in the runtime set.
        run: pip install -r requirements.txt

      - name: Harvest and nest
        run: |
          python3 vocab_build.py \
            --source "${{ inputs.source || 'both' }}" \
            --teater-mode "${{ inputs.teater_mode || 'snapshot' }}" \
            --stats

      - name: Nesting must be reproducible offline
        run: python3 vocab_build.py --from-flat --check

      - name: Upload vocabulary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vocabularies
          path: |
            data_samples/vocab/*.json
            data_samples/vocab/*.csv
          if-no-files-found: error

      - name: Open a pull request
        if: inputs.open_pr
        # SHA-pinned: this action runs with contents:write + pull-requests:write,
        # so a force-pushed tag would run attacker code holding both. Dependabot keeps
        # SHA and comment current.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: chore/vocab-refresh-${{ github.run_id }}
          title: 'chore(vocab): refresh AMCR + TEATER vocabularies'
          body: |
            Regenerated by the Vocabulary Refresh workflow.

            Review `data_samples/vocab/*_placement_audit.csv` first: it records the rule
            that placed every term, so a changed grouping can be read as a diff instead
            of being taken on trust.
          add-paths: data_samples/vocab

      # One open issue per failing lane, commented on by each later failure; scheduled runs only
      # (atrium-project#81). It used to open a new issue on every failing run.
      - name: Open or update the lane's issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: ufal/atrium-project/.github/actions/lane-failure-issue@18f06680dfb60142eeece2f46189f9a2fa79230a  # v1
        with:
          lane: vocab-refresh
          title: Scheduled vocabulary refresh failed
          labels: bug,automated issue
          body: >-
            The vocabulary harvest failed. Please review the action logs.
